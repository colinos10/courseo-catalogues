name: Mise à jour automatique des catalogues

on:
  schedule:
    # S'exécute automatiquement tous les jours à 4h00 du matin (heure UTC)
    - cron: '0 4 * * *'
  workflow_dispatch: # Permet de lancer le script manuellement pour tester

permissions:
  contents: write # Donne le droit à GitHub de modifier et sauvegarder le fichier JSON

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v3

      - name: Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          pip install requests beautifulsoup4

      - name: Lancer le script d'extraction
        run: python scraper.py

      - name: Enregistrer les modifications sur GitHub
        run: |
          git config --global user.name "Catalog Bot"
          git config --global user.email "bot@github.com"
          git add catalogues.json
          git commit -m "Mise à jour automatique des catalogues" || exit 0
          git push
